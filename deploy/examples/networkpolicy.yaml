# OPTIONAL TEMPLATE: replace every operator-specific selector/CIDR before applying.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata: {name: agt-mcp, namespace: agt-mcp}
spec:
  podSelector: {matchLabels: {app: agt-mcp}}
  policyTypes: [Ingress, Egress]
  ingress:
    - from:
        - namespaceSelector: {matchLabels: {agt-mcp-client: allowed}}
      ports: [{protocol: TCP, port: 8000}]
  egress:
    - to:
        - namespaceSelector: {matchLabels: {kubernetes.io/metadata.name: kube-system}}
      ports: [{protocol: UDP, port: 53}, {protocol: TCP, port: 53}]
    - to:
        - ipBlock: {cidr: 192.0.2.1/32} # Replace with Kubernetes API destination.
      ports: [{protocol: TCP, port: 443}]
    - to:
        - namespaceSelector: {matchLabels: {agt-observability: allowed}}
      ports: [{protocol: TCP, port: 9090}]
    # Approved probe targets require explicit destinations/ports here AND ProbePolicy.

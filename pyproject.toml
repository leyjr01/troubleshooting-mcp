[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "api-gateway-troubleshooting-mcp"
version = "0.1.0"
description = "Vendor-neutral evidence-first troubleshooting contracts"
readme = "README.md"
requires-python = ">=3.12"
dependencies = ["pydantic>=2.10,<3", "PyYAML>=6,<7", "fastmcp==4.0.5"]

[project.optional-dependencies]
dev = ["pytest>=8,<9", "pytest-cov>=6,<8", "ruff>=0.9,<1", "mypy>=1.14,<2", "types-PyYAML>=6,<7", "bandit>=1.8,<2"]

[project.scripts]
agt-mcp = "agt_mcp.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
markers = ["unit: isolated local tests", "contract: adapter contract tests", "integration: local composition only", "scenario: future diagnostic scenarios", "local_transport: numeric loopback MCP transport tests"]

[tool.coverage.run]
source = ["agt_mcp"]
branch = true

[tool.coverage.report]
show_missing = true
fail_under = 80
exclude_also = ["@abstractmethod", "if __name__ == .__main__.:"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src"]
plugins = ["pydantic.mypy"]

[tool.pydantic-mypy]
init_forbid_extra = true
warn_required_dynamic_aliases = true

# Merge with the appropriate environment configuration. Disabled until approved.
# Endpoint and resource IDs must be adapted to the actual runtime inventory.
observability:
  limits:
    max_window_seconds: 3600
    max_items: 100
    max_resources: 12
    max_text_chars: 2048
    max_log_lines: 8
    max_response_bytes: 262144
    source_timeout_seconds: 3
  sources:
    - id: prometheus-main
      type: prometheus
      enabled: false
      environment_id: demo
      usage: [METRIC]
      url: https://prometheus.example:443
      credentials:
        provider: environment
        reference: PROMETHEUS_TOKEN
        environment_id: demo
      tls:
        verify: true
        ca_reference: null
      network_policy:
        environment_id: demo
        allowed_hosts: [prometheus.example]
        allowed_networks: [10.20.0.0/16]
        allowed_ports: [443]
        allowed_protocols: [https]
      bindings:
        - environment_id: demo
          resource_id: replace-with-canonical-runtime-id
          keys:
            namespace: example
            service: apicast-production
          selectors:
            namespace: example
            service: apicast-production
      metric_names:
        availability: up
        restarts: kube_pod_container_status_restarts_total
        resource_usage: container_cpu_usage_seconds_total
        latency: http_request_duration_seconds
        error_rate: http_requests_total
      error_status_label: code
